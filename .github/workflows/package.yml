name: Build portable preview
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - shell: powershell
        run: |
          .\tools\Test.ps1
          .\tools\Build.ps1
          $launcher = Start-Process .\TongjiVPN.exe -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru -Wait
          if ($launcher.ExitCode -ne 0) { throw 'Compiled launcher failed.' }
          .\tools\Package.ps1
          Get-ChildItem .\dist -Filter '*.zip' | ForEach-Object {
            .\tools\Test-Package.ps1 -PackagePath $_.FullName
          }
      - uses: actions/upload-artifact@v4
        with:
          name: tongji-openconnect-windows-x64-preview
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
